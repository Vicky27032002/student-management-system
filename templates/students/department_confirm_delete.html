{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header bg-danger text-white">
        Delete Department
    </div>

    <div class="card-body">

        <p>
            Are you sure you want to delete
            <strong>{{ department.name }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">
                Delete
            </button>

            <a href="{% url 'department_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
