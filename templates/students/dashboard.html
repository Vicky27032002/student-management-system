{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row">

    <div class="col-md-6">
        <div class="card text-center border-primary mb-3">
            <div class="card-header bg-primary text-white">
                Total Departments
            </div>

            <div class="card-body">
                <h1>{{ total_departments }}</h1>

                <a href="{% url 'department_list' %}" class="btn btn-primary">
                    View Departments
                </a>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card text-center border-success mb-3">
            <div class="card-header bg-success text-white">
                Total Students
            </div>

            <div class="card-body">
                <h1>{{ total_students }}</h1>

                <a href="{% url 'student_list' %}" class="btn btn-success">
                    View Students
                </a>
            </div>
        </div>
    </div>

</div>

<hr>

<div class="mt-4">
    <h4>Quick Actions</h4>

    <a href="{% url 'department_create' %}" class="btn btn-primary me-2">
        + Add Department
    </a>

    <a href="{% url 'student_create' %}" class="btn btn-success">
        + Add Student
    </a>
</div>

{% endblock %}
