{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header bg-primary text-white">
        Student Form
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">
                Save
            </button>

            <a href="{% url 'student_list' %}"
               class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

{% endblock %}
